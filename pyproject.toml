[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opkv"
version = "0.1.0"
description = "Extract the 'Linux version' banner from the boot.img of OnePlus, OPPO and Realme OTA packages via HTTP Range."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "luigimak"}]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "lz4>=4",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# `opkv archive` unpacks the boot.7z assets of the spike0en archive; the update workflow does not need it
archive = ["py7zr>=1.0"]
dev = [
    "py7zr>=1.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[project.scripts]
opkv = "opkv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a connection left to the garbage collector is a bug: fail on it
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF", "S", "BLE"]
ignore = [
    "E701", "E702",           # the compact one-line style used across the code
    "S310",                   # urlopen: the URLs are fixed https endpoints or pass rangehttp.check_scheme
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S303", "S311", "S324", "BLE001"]
# the OTA servers' public keys are single base64 lines
"src/opkv/ota_query.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["annotation-unchecked"]      # local annotations in the untyped command functions
