[project]
name = "opkv"
version = "0.1.0"
description = "Estrae 'Linux version' dal boot.img degli OTA OnePlus via HTTP Range."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["lz4", "zstandard", "cryptography"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
opkv = "opkv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
