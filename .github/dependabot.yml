version: 2
updates:
  # the workflows pin actions by commit SHA: Dependabot moves the pins
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # requirements.txt (hash-pinned, used by the daily update) and the pinned dev tools in pyproject.toml
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
