name: update-results

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    # scheduled runs stay off until the repository variable AUTO_UPDATE is set to 'true';
    # manual runs (workflow_dispatch) always work
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_UPDATE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # always work on the default branch, even for manual runs started from another ref
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # the catalog is not versioned: state lives in data/results.json (already processed ids)
      - name: Fetch catalog (API roms.danielspringer.at)
        run: opkv fetch

      - name: Extract Linux version for new OnePlus releases
        run: |
          opkv discover
          opkv run --retry-failed --workers 6

      - name: Regenerate table
        run: opkv report

      - name: Commit results to the default branch
        run: |
          if git diff --quiet -- data/results.json data/results.md; then
            echo "nothing new"; exit 0
          fi
          n=$(python - <<'PY'
          import json,subprocess
          old=json.loads(subprocess.check_output(["git","show","HEAD:data/results.json"]))
          new=json.load(open("data/results.json"))
          o={r["id"] for r in old}
          print(sum(1 for r in new if r["id"] not in o))
          PY
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/results.md
          git commit -m "data: add $n new OnePlus firmware kernel versions"
          # the run can take a while: rebase on top of anything pushed to main meanwhile
          branch="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then exit 0; fi
            echo "push rejected (attempt $attempt), retrying"; sleep 5
          done
          echo "push to $branch failed"; exit 1
