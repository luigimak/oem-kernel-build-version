name: update-results

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:

# the job asks for what it needs
permissions: {}

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    name: Update results
    # scheduled runs stay off until the repository variable AUTO_UPDATE is set to 'true' (so forks never run them);
    # manual runs (workflow_dispatch) always work
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_UPDATE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90          # the first run after a new brand is added has hundreds of firmware to read
    permissions:
      contents: write   # commits data/<brand>.json and .md to the default branch
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
      PYTHONPATH: src             # run opkv from the checkout: nothing but the hashed requirements is downloaded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # always work on the default branch, even for manual runs started from another ref
          ref: ${{ env.BRANCH }}
          # the token is handed to the commit step only, not left in .git/config for the steps that run our code
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # hash-pinned runtime dependencies; requirements.txt is generated from pyproject.toml (see its header)
      - name: Install
        run: pip install --require-hashes -r requirements.txt

      # the catalog is not versioned: state lives in data/<brand>.json (already processed firmware)
      - name: Fetch catalog (API roms.danielspringer.at)
        run: python -m opkv fetch

      - name: Extract Linux version for new OnePlus, OPPO and Realme releases
        run: |
          python -m opkv discover
          python -m opkv run --retry-failed --workers 6

      - name: Regenerate table
        run: python -m opkv report

      - name: Commit results to the default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add --intent-to-add data/*.json data/*.md       # a brand seen for the first time counts as a change
          if git diff --quiet -- data/*.json data/*.md; then
            echo "nothing new"; exit 0
          fi
          msg=$(python - <<'PY'
          import glob, json, os, subprocess
          from opkv.normalize import firmware_key
          new = {}
          for path in sorted(glob.glob("data/*.json")):
              if os.path.basename(path) == "catalog.json":
                  continue
              show = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, text=True)
              known = {firmware_key(r) for r in json.loads(show.stdout)} if show.returncode == 0 else set()
              new[os.path.basename(path)[:-5]] = sum(1 for r in json.load(open(path)) if firmware_key(r) not in known)
          label = {"oneplus": "OnePlus", "oppo": "OPPO", "realme": "Realme"}
          parts = [f"{n} {label.get(b, b)}" for b, n in new.items() if n]
          print(f"data: add {' + '.join(parts)} new firmware kernel versions" if parts
                else "data: update metadata of existing firmware entries")
          PY
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.md
          git commit -m "$msg"
          # the token goes to git as an HTTP header of the two network commands below and nowhere else
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git_net() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          # the run can take a while: rebase on top of anything pushed to the branch meanwhile
          for attempt in 1 2 3; do
            if git_net pull --rebase origin "$BRANCH" && git_net push origin "HEAD:$BRANCH"; then exit 0; fi
            git rebase --abort 2>/dev/null || true       # a conflicting rebase stops half-way: start over
            echo "pull or push failed (attempt $attempt), retrying"; sleep 5
          done
          echo "push to $BRANCH failed"; exit 1

  # the site shows data/<brand>.json: publish it again after the daily run
  pages:
    name: Publish site
    needs: update
    if: needs.update.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml  # zizmor: ignore[self-repository] -- actionlint does not accept the $/ syntax
