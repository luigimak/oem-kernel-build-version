name: update-results

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    # scheduled runs stay off until the repository variable AUTO_UPDATE is set to 'true';
    # manual runs (workflow_dispatch) always work
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_UPDATE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # the catalog is not versioned: state lives in data/results.json (already processed ids)
      - name: Fetch catalog (API roms.danielspringer.at)
        run: opkv fetch

      - name: Extract Linux version for new OnePlus releases
        run: |
          opkv discover
          opkv run --retry-failed --workers 6

      - name: Regenerate table
        run: opkv report

      - name: Open draft PR if results changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/results.json data/results.md; then
            echo "nothing new"; exit 0
          fi
          n=$(python - <<'PY'
          import json,subprocess
          old=json.loads(subprocess.check_output(["git","show","HEAD:data/results.json"]))
          new=json.load(open("data/results.json"))
          o={r["id"] for r in old}
          print(sum(1 for r in new if r["id"] not in o))
          PY
          )
          branch="auto/results-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/results.json data/results.md
          git commit -m "data: add $n new OnePlus firmware kernel versions"
          git push origin "$branch"
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "data: $n new OnePlus firmware kernel versions" \
            --body "$(cat <<EOF
          ## What
          $n new OnePlus releases from the roms.danielspringer.at catalog or the OTA query, with \`kernel_release\` and \`build\` extracted from boot.img.

          ## Why
          Automatic weekly update (\`opkv fetch && opkv discover && opkv run && opkv report\`).

          ## How tested
          Extraction via HTTP Range from payload.bin on an ubuntu-latest runner, Python 3.12. No device involved.

          ## Risks
          Expired download links may leave rows with \`ok: false\` (retried on the next run).
          EOF
          )"
