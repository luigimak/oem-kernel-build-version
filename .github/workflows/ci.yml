name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # oldest supported, the one the update workflow runs, newest
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      - name: Lint
        if: matrix.python == '3.12'
        run: ruff check .

      - name: Types
        if: matrix.python == '3.12'
        run: mypy

      - name: Tests
        run: pytest --cov=opkv --cov-report=term-missing --cov-fail-under=90

  workflows:
    name: Workflow lint
    # the update workflow can push to the default branch: keep it linted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install actionlint-py==1.7.12.25 zizmor==1.31.1

      - run: actionlint

      - run: zizmor --offline --no-progress .github/workflows
