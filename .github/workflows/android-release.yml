name: android-release

# A tag `app-vX.Y.Z` builds the signed APK and leaves it in a DRAFT release: publishing it is a manual step.
on:
  push:
    tags: ["app-v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

env:
  # SHA-256 of the certificate the app is signed with (public: it is also in the README). A build signed with anything else
  # (a wrong or replaced key in the secrets) fails here instead of producing an APK that cannot update the installed app.
  EXPECTED_CERT_SHA256: 1fd1591e1c47cdde316d77f9a4e30ecbffbb8c40ac4d2a83b9ef3748e1adb92f

jobs:
  build:
    name: Signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # the signing secrets live in this environment: the job only starts after the owner approves it, and only for an app-v* tag
    environment: android-release
    permissions:
      contents: read        # checkout
      id-token: write       # build provenance attestation
      attestations: write   # build provenance attestation
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # no cache: what a release builds must not depend on, or feed, a shared cache
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          cache-disabled: true

      - name: Version from the tag
        run: |
          v="${TAG#app-v}"
          IFS=. read -r major minor patch <<< "$v"
          {
            echo "OEMKBV_VERSION_NAME=$v"
            echo "OEMKBV_VERSION_CODE=$((major * 10000 + minor * 100 + patch))"
          } >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OEMKBV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        working-directory: android
        env:
          OEMKBV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OEMKBV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OEMKBV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Check the signature and name the file
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::the APK is not signed with the expected certificate"
            exit 1
          fi
          mkdir dist
          cp "$apk" "dist/OEM-KernelBuildVersion-${TAG#app-}.apk"
          (cd dist && sha256sum ./*.apk | tee SHA256SUMS)

      # a signed statement that this APK was built by this workflow from this commit: gh attestation verify <apk> --repo <owner/repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: apk
          path: dist
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write    # create the release
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: apk
          path: dist

      - name: Create the draft release
        env:
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag \
            --title "App ${TAG#app-}" \
            --notes "Signed APK of the OEM-KernelBuildVersion app. Signing certificate SHA-256: ${EXPECTED_CERT_SHA256}. Check a download with apksigner verify --print-certs, or with gh attestation verify <file> --repo ${REPO}. The checksums are in SHA256SUMS."
