name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # called by update.yml: pushes made with GITHUB_TOKEN do not start workflows, so the daily data commit cannot trigger the push above
  workflow_call:
  workflow_dispatch:

# the job asks for what it needs
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read    # checkout
      pages: write      # deploy-pages
      id-token: write   # deploy-pages proves the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the latest data, even when called right after the update commit
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Assemble site
        run: |
          mkdir _site
          cp docs/index.html _site/
          cp data/results.json _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
